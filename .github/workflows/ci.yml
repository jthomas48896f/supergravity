name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Lint (server, lib, tooling)
        run: npm run lint
      - name: Build smoke test
        run: npm test
      - name: Tutor eval regression gate (baseline mode)
        run: npm run eval:tutor
